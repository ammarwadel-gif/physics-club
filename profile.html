<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — BS Physics Club</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#311432;--bg-2:#3D1A42;--line:#4A2250;
  --text:#E8E5EA;--text-soft:#B8A9BD;--white:#FFFFFF;
  --amber:#C97A1F;--red:#C4453A;--teal:#1F6E64;
  --radius-s:4px;--radius-m:8px;
  --serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',sans-serif;--maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--white);}
p{margin:0;}

header.site{position:sticky;top:0;z-index:100;background:rgba(49,20,50,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:72px;gap:12px;}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--white);}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:contain;border:2px solid rgba(201,122,31,0.4);}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:0.65rem;letter-spacing:0.05em;color:var(--text-soft);margin-top:2px;text-transform:uppercase;}
nav.primary{display:flex;gap:4px;flex-wrap:wrap;}
nav.primary a{padding:9px 14px;font-size:0.9rem;font-weight:500;color:var(--text-soft);transition:all .15s;}
nav.primary a:hover{color:var(--white);}
nav.primary a.active{color:var(--white);box-shadow:inset 0 -2px 0 var(--amber);}
.user-chip{display:flex;align-items:center;gap:6px;font-size:0.82rem;font-weight:600;color:var(--amber);padding:7px 12px;background:rgba(201,122,31,0.15);border:1px solid var(--amber);border-radius:var(--radius-s);}
@media (max-width:1080px){nav.primary{display:none;}}

.page-hero{padding:50px 0 36px;border-bottom:1px solid var(--line);}
.page-hero h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.1;margin-bottom:12px;}
.page-hero p{color:var(--text-soft);font-size:1rem;}
.breadcrumbs{font-size:0.85rem;color:var(--text-soft);margin-bottom:14px;}
.breadcrumbs a:hover{color:var(--amber);}
.breadcrumbs span{margin:0 8px;opacity:0.5;}

.section{padding:50px 0;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media (max-width:860px){.grid-3{grid-template-columns:1fr;}}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:26px;}
.card h3{font-size:1.1rem;margin-bottom:12px;}
.card p{color:var(--text-soft);font-size:0.92rem;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-s);font-size:0.85rem;font-weight:600;transition:all .15s;margin-top:16px;}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--line);}
.btn-outline:hover{border-color:var(--amber);color:var(--white);}
.btn-primary{background:var(--amber);color:#fff;}
.btn-primary:hover{background:#B06A15;}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}

.empty-state{
  padding:60px 24px;text-align:center;color:var(--text-soft);
  border:1px dashed var(--line);border-radius:var(--radius-m);
  background:rgba(61,26,66,0.4);
}
.empty-state h3{font-size:1.3rem;margin-bottom:12px;}
.empty-state p{margin-bottom:22px;}

.action-row{display:flex;gap:12px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap;}

footer.site-footer{background:#240F26;color:var(--text-soft);padding:30px 0;text-align:center;font-size:0.82rem;border-top:1px solid var(--line);}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="BS Physics Club" onerror="this.style.display='none'">
      <span>BS Physics Club<small>Academic Ecosystem</small></span>
    </a>
    <nav class="primary">
      <a href="index.html">Home</a>
      <a href="learning.html">Learning Hub</a>
      <a href="research.html">Research</a>
      <a href="competitions.html">Competitions</a>
      <a href="programs.html">Programs</a>
      <a href="about.html">About</a>
      <a href="profile.html" class="active">Profile</a>
    </nav>
    <div class="nav-right">
      <a href="login.html" id="adminChip" class="user-chip" style="display:none;">
        <i class="fas fa-user-shield"></i> <span id="adminName">Admin</span>
      </a>
    </div>
  </div>
</header>

<section class="page-hero"><div class="wrap">
  <div class="breadcrumbs"><a href="index.html">Home</a><span>/</span>Profile</div>
  <h1 id="profileTitle">Your profile</h1>
  <p id="profileSubtitle"></p>
</div></section>

<section class="section"><div class="wrap" id="profileContent"></div></section>

<footer class="site-footer">© <span id="year"></span> BS Physics Club.</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
let currentUser = null;
try{ const s = sessionStorage.getItem('pc_session'); if(s) currentUser = JSON.parse(s); }catch(e){}

function esc(s){ return (s==null?'':s.toString()).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

if(currentUser){
  document.getElementById('profileTitle').textContent = currentUser.name || currentUser.username;
  document.getElementById('profileSubtitle').innerHTML = 'Signed in as <strong>'+esc(currentUser.username)+'</strong> · Role: <strong>'+esc(currentUser.role)+'</strong>';
  document.getElementById('adminChip').style.display='flex';
  document.getElementById('adminChip').href='admin.html';
  document.getElementById('adminName').textContent = currentUser.name || currentUser.username;

  // Count checklist progress
  const totalChecked = (()=>{
    try{
      const cl = JSON.parse(localStorage.getItem('pc_lo_progress')||'{}');
      return Object.values(cl).reduce((a,g)=>a+Object.values(g).filter(Boolean).length,0);
    }catch(e){return 0;}
  })();

  document.getElementById('profileContent').innerHTML = `
    <div class="grid-3">
      <div class="card">
        <h3>📊 Curriculum</h3>
        <p>You've completed <strong style="color:var(--white);">${totalChecked}</strong> Learning Objectives.</p>
        <a href="learning.html" class="btn btn-outline">Continue learning →</a>
      </div>
      <div class="card">
        <h3>🏆 Competitions</h3>
        <p>Browse the database and find your next challenge.</p>
        <a href="competitions.html" class="btn btn-outline">View competitions →</a>
      </div>
      <div class="card">
        <h3>🎓 Programs</h3>
        <p>Apply to seasonal programs and research tracks.</p>
        <a href="programs.html" class="btn btn-outline">Explore programs →</a>
      </div>
    </div>
    <div class="action-row">
      ${currentUser.role==='admin' ? '<a href="admin.html" class="btn btn-primary">Open Admin Panel →</a>' : ''}
      <button id="logoutBtn" class="btn btn-danger">Log out</button>
    </div>`;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem('pc_session'); location.href='index.html';
  });
} else {
  document.getElementById('profileContent').innerHTML = `
    <div class="empty-state">
      <h3>You're browsing as a guest</h3>
      <p>Sign in as an admin to access the content management panel.</p>
      <a href="login.html" class="btn btn-primary">Sign in</a>
    </div>`;
}
</script>
</body>
</html>
