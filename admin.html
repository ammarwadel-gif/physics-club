<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Physics Club — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#311432;--bg-2:#3D1A42;--line:#4A2250;--text:#E8E5EA;--text-soft:#B8A9BD;--white:#FFFFFF;--amber:#C97A1F;--red:#C4453A;--radius-s:4px;--radius-m:8px;--serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',sans-serif;--maxw:1240px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;font-size:0.9rem;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;color:var(--white);}
p{margin:0;}

header.site{position:sticky;top:0;z-index:100;background:rgba(49,20,50,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:76px;gap:14px;}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:700;font-size:1.25rem;color:var(--white);flex:none;}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;object-fit:cover;border:2px solid rgba(201,122,31,0.4);display:block;}
nav.primary{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}
nav.primary a{padding:9px 11px;border-radius:var(--radius-s);font-size:0.85rem;font-weight:500;color:var(--text-soft);transition:all .15s;}
nav.primary a:hover{background:var(--bg-2);color:var(--white);}
@media (max-width:1200px){nav.primary a{padding:7px 8px;font-size:0.78rem;}}
@media (max-width:1080px){nav.primary{display:none;}}

.page-hero{padding:50px 0 36px;border-bottom:1px solid var(--line);}
.page-hero h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.1;margin-bottom:14px;}
.page-hero p{color:var(--text-soft);font-size:1rem;max-width:680px;}
.breadcrumbs{font-size:0.85rem;color:var(--text-soft);margin-bottom:14px;}
.breadcrumbs a:hover{color:var(--amber);}
.breadcrumbs span{margin:0 8px;opacity:0.5;}

.section{padding:40px 0;}
.admin-banner{background:rgba(201,122,31,0.12);border:1px solid var(--amber);color:#E8C79A;padding:14px 18px;border-radius:var(--radius-m);font-size:0.88rem;margin-bottom:26px;display:flex;align-items:center;gap:10px;}

.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap;}
.admin-tab{padding:11px 14px;font-size:0.82rem;font-weight:600;color:var(--text-soft);border-bottom:2px solid transparent;margin-bottom:-1px;background:none;transition:all .15s;}
.admin-tab.active{color:var(--white);border-bottom-color:var(--amber);}
.admin-tab:hover:not(.active){color:var(--text);}

.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:24px;margin-bottom:20px;}
.card h3{font-size:1.05rem;margin-bottom:16px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full-row{grid-column:1/-1;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.form-grid input,.form-grid select,.form-grid textarea{padding:11px 14px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%;}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{outline:none;border-color:var(--amber);}
.form-grid textarea{min-height:70px;resize:vertical;}

.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:var(--radius-s);font-size:0.85rem;font-weight:600;transition:all .15s;cursor:pointer;}
.btn-primary{background:var(--amber);color:#fff;}
.btn-primary:hover{background:#B06A15;}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-sm{padding:7px 14px;font-size:0.78rem;}

.admin-list-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.admin-list-row:last-child{border-bottom:none;}
.admin-list-row .info h4{font-size:0.95rem;color:var(--white);}
.admin-list-row .info p{font-size:0.78rem;color:var(--text-soft);margin-top:3px;}
.admin-list-actions{display:flex;gap:8px;flex:none;}

.help-note{font-size:0.8rem;color:var(--text-soft);margin-top:6px;font-style:italic;}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 76px);padding:40px 20px;}
.login-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-m);padding:44px 40px;max-width:440px;width:100%;}
.login-card h2{font-size:1.6rem;margin-bottom:10px;}
.login-card p.help{color:var(--text-soft);font-size:0.9rem;margin-bottom:26px;}
.login-field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.login-field label{font-size:0.82rem;font-weight:600;}
.login-field input{padding:12px 14px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--bg);color:var(--text);}
.login-field input:focus{outline:none;border-color:var(--amber);}
.login-btn{width:100%;justify-content:center;padding:13px;font-size:0.95rem;}
.login-msg{font-size:0.88rem;padding:11px 14px;border-radius:var(--radius-s);margin-bottom:14px;display:none;}
.login-msg.err{display:block;background:rgba(196,69,58,0.15);color:#E8907C;border:1px solid var(--red);}

footer.site-footer{background:#240F26;color:var(--text-soft);padding:36px 0 24px;border-top:1px solid var(--line);text-align:center;font-size:0.85rem;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="brand">
      <img src="logo.jpeg" alt="BS Physics Club">
      <span>BS Physics Club — Admin</span>
    </a>
    <nav class="primary">
      <a href="index.html">Home</a>
      <a href="learning.html">Learning Hub</a>
      <a href="research.html">Research</a>
      <a href="competitions.html">Competitions</a>
      <a href="programs.html">Programs</a>
      <a href="magazine.html">Magazine</a>
      <a href="books.html">Books</a>
      <a href="about.html">About</a>
      <a href="profile.html">Profile</a>
    </nav>
  </div>
</header>

<div id="app"></div>

<footer class="site-footer">
  <div class="wrap">© <span id="year"></span> BS Physics Club — Admin Panel</div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const KEYS = {
  users:'pc_users', session:'pc_session',
  competitions:'pc_competitions', programs:'pc_programs',
  curriculum:'pc_curriculum_sem', learningContent:'pc_learning_content',
  journey:'pc_journey',
  researchTopics:'pc_research_topics', researchContent:'pc_research_content',
  magazine:'pc_magazine', books:'pc_books',
  settings:'pc_settings'
};

const DEFAULT_USERS = [
  { username:'admin', password:'physics2026', name:'Main Admin', role:'admin' },
  { username:'mazen', password:'mazen123', name:'Mazen', role:'admin' },
  { username:'ahmed', password:'ahmed456', name:'Ahmed', role:'admin' },
];

const DEFAULT_CURRICULUM = {
  "g10-s1": { grade:10, semester:1, items:[
    {id:"g10s1_1", title:"Units and Measurements"},
    {id:"g10s1_2", title:"Motion in a Straight Line"},
    {id:"g10s1_3", title:"Motion in a Plane"},
    {id:"g10s1_4", title:"Laws of Motion"},
    {id:"g10s1_5", title:"Work, Energy and Power"},
    {id:"g10s1_6", title:"System of Particles & Rotational Motion"},
    {id:"g10s1_7", title:"Gravitation"},
  ]},
  "g10-s2": { grade:10, semester:2, items:[
    {id:"g10s2_1", title:"Mechanical Properties of Solids"},
    {id:"g10s2_2", title:"Mechanical Properties of Fluids"},
    {id:"g10s2_3", title:"Thermal Properties of Matter"},
    {id:"g10s2_4", title:"Thermodynamics"},
  ]},
  "g11-s1": { grade:11, semester:1, items:[
    {id:"g11s1_1", title:"Electric Charges and Fields"},
    {id:"g11s1_2", title:"Electrostatic Potential and Capacitance"},
    {id:"g11s1_3", title:"Current Electricity"},
    {id:"g11s1_4", title:"Moving Charges and Magnetism"},
    {id:"g11s1_5", title:"Magnetism and Matter"},
    {id:"g11s1_6", title:"Electromagnetic Induction"},
    {id:"g11s1_7", title:"Alternating Current"},
  ]},
  "g11-s2": { grade:11, semester:2, items:[
    {id:"g11s2_1", title:"Electromagnetic Waves"},
    {id:"g11s2_2", title:"Ray Optics and Optical Instruments"},
    {id:"g11s2_3", title:"Wave Optics"},
    {id:"g11s2_4", title:"Dual Nature of Radiation and Matter"},
  ]},
};
const DEFAULT_TOPICS = [
  {key:'academic-writing', icon:'✍️', title:'Academic & Scientific Writing', desc:'Structure papers, write abstracts, cite properly.'},
  {key:'intro-research', icon:'🔎', title:'Introduction to Research', desc:'What research is and how to formulate questions.'},
  {key:'literature-review', icon:'📚', title:'Literature Review', desc:'Find, read, and synthesize prior research.'},
  {key:'data-analysis', icon:'📊', title:'Data Analysis', desc:'Tools for analyzing experimental data.'},
  {key:'experimental-methods', icon:'🧪', title:'Experimental Methods', desc:'Lab safety, measurement, error analysis.'},
];
const DEFAULT_PROGRAMS = [
  {id:'p1', name:'Competition Prep Track', status:'open', category:'current', grade:'11–12', deadline:'2026-10-05', desc:'Season-long olympiad training.'},
  {id:'p2', name:'Physics Research Program', status:'open', category:'current', grade:'10–12', deadline:'2026-10-20', desc:'Introduction to research methodology.'},
];
const DEFAULT_SETTINGS = { clubName:'BS Physics Club', logo:'logo.jpeg', fb:'#', ig:'#', tt:'#', li:'#', yt:'#' };

function load(key, fb){ try{ const raw=localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){} return JSON.parse(JSON.stringify(fb)); }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function genId(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return (s==null?'':s.toString()).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let currentUser = null;
try{ const s = sessionStorage.getItem(KEYS.session); if(s) currentUser = JSON.parse(s); }catch(e){}

/* LOGIN */
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h2>Admin sign in</h2>
      <p class="help">Enter your credentials to access the content management panel.</p>
      <div class="login-msg" id="msg"></div>
      <form id="loginForm">
        <div class="login-field"><label>Username</label><input type="text" name="username" required></div>
        <div class="login-field"><label>Password</label><input type="password" name="password" required></div>
        <button type="submit" class="btn btn-primary login-btn">Sign in</button>
      </form>
    </div></div>`;
  document.getElementById('loginForm').addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const users = load(KEYS.users, DEFAULT_USERS);
    const u = users.find(x=>x.username===fd.get('username').trim() && x.password===fd.get('password'));
    if(u){
      currentUser = {username:u.username, name:u.name, role:u.role};
      sessionStorage.setItem(KEYS.session, JSON.stringify(currentUser));
      renderAdmin();
    } else {
      const m = document.getElementById('msg');
      m.className='login-msg err'; m.textContent='Invalid credentials.';
    }
  });
}

/* ADMIN LAYOUT */
let adminTab = 'curriculum';

const TABS = [
  {key:'curriculum', label:'📘 Curriculum'},
  {key:'learning', label:'🎥 Learning Content'},
  {key:'journey', label:'🚀 Journey'},
  {key:'research', label:'🔬 Research Topics'},
  {key:'researchContent', label:'📂 Research Content'},
  {key:'competitions', label:'🏆 Competitions'},
  {key:'programs', label:'🎓 Programs'},
  {key:'magazine', label:'📰 Magazine'},
  {key:'books', label:'📖 Books'},
  {key:'users', label:'👤 Admins'},
  {key:'settings', label:'⚙️ Settings'},
];

function renderAdmin(){
  document.getElementById('app').innerHTML = `
    <section class="page-hero"><div class="wrap">
      <div class="breadcrumbs"><a href="index.html">Home</a><span>/</span>Admin Panel</div>
      <h1>Admin Panel</h1>
      <p>Welcome, ${esc(currentUser.name||currentUser.username)}. Full control over all site content.</p>
      <button class="btn btn-danger btn-sm" id="logoutBtn" style="margin-top:16px;">Log out</button>
    </div></section>
    <section class="section"><div class="wrap">
      <div class="admin-banner"><i class="fas fa-shield-alt"></i> You're signed in as admin. All changes save locally and appear immediately on this site.</div>
      <div class="admin-tabs">${TABS.map(t=>`<button class="admin-tab ${adminTab===t.key?'active':''}" data-tab="${t.key}">${t.label}</button>`).join('')}</div>
      <div id="panel"></div>
    </div></section>`;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem(KEYS.session); currentUser=null; location.href='index.html';
  });
  document.querySelectorAll('.admin-tab').forEach(t=> t.addEventListener('click', ()=>{
    adminTab = t.dataset.tab;
    document.querySelectorAll('.admin-tab').forEach(x=>x.classList.toggle('active', x.dataset.tab===adminTab));
    paintPanel();
  }));
  paintPanel();
}

function paintPanel(){
  const p = document.getElementById('panel');
  if(adminTab==='curriculum') p.innerHTML = renderCurriculumTab();
  else if(adminTab==='learning') p.innerHTML = renderLearningTab();
  else if(adminTab==='journey') p.innerHTML = renderJourneyTab();
  else if(adminTab==='research') p.innerHTML = renderResearchTab();
  else if(adminTab==='researchContent') p.innerHTML = renderResearchContentTab();
  else if(adminTab==='competitions') p.innerHTML = renderCompetitionsTab();
  else if(adminTab==='programs') p.innerHTML = renderProgramsTab();
  else if(adminTab==='magazine') p.innerHTML = renderMagazineTab();
  else if(adminTab==='books') p.innerHTML = renderBooksTab();
  else if(adminTab==='users') p.innerHTML = renderUsersTab();
  else if(adminTab==='settings') p.innerHTML = renderSettingsTab();
  bindPanelEvents();
}

/* TABS CONTENT */
function renderCurriculumTab(){
  const curr = load(KEYS.curriculum, DEFAULT_CURRICULUM);
  const groups = [
    {key:'g10-s1', label:'Grade 10 · Semester 1'},
    {key:'g10-s2', label:'Grade 10 · Semester 2'},
    {key:'g11-s1', label:'Grade 11 · Semester 1'},
    {key:'g11-s2', label:'Grade 11 · Semester 2'},
  ];
  return `
    <div class="card"><h3>Add Learning Objective</h3>
      <form id="formAdd" class="form-grid">
        <select name="group" required>${groups.map(g=>`<option value="${g.key}">${g.label}</option>`).join('')}</select>
        <input name="title" placeholder="LO title" required>
        <button type="submit" class="btn btn-primary full-row" style="justify-content:center;">Add LO</button>
      </form>
    </div>
    ${groups.map(g=>{
      const items = curr[g.key]?.items || [];
      return `<div class="card"><h3>${g.label} (${items.length})</h3>
        ${items.length ? items.map(it=>`<div class="admin-list-row"><div class="info"><h4>${esc(it.title)}</h4></div><div class="admin-list-actions"><button class="btn btn-danger btn-sm" data-del="${it.id}" data-type="curriculum" data-group="${g.key}">Delete</button></div></div>`).join('') : `<p class="help-note">No LOs yet.</p>`}
      </div>`;
    }).join('')}`;
}

function renderLearningTab(){
  const curr = load(KEYS.curriculum, DEFAULT_CURRICULUM);
  const content = load(KEYS.learningContent, {});
  const allLOs = [];
  Object.keys(curr).forEach(k=> (curr[k].items||[]).forEach(it=> allLOs.push({...it, group:k})));
  return `
    <div class="card"><h3>Upload to a Learning Objective</h3>
      <p class="help-note" style="margin-bottom:14px;">Choose an LO, then add a video, file, or quiz.</p>
      <form id="formAdd" class="form-grid">
        <select name="loId" required class="full-row"><option value="">-- Choose LO --</option>${allLOs.map(lo=>`<option value="${lo.id}">[${lo.group}] ${esc(lo.title)}</option>`).join('')}</select>
        <select name="kind" required><option value="videos">📹 Video</option><option value="files">📄 File</option><option value="quizzes">❓ Quiz</option></select>
        <input name="title" placeholder="Title" required>
        <input name="url" placeholder="URL (optional)" class="full-row">
        <button type="submit" class="btn btn-primary full-row" style="justify-content:center;">Add</button>
      </form>
    </div>
    <div class="card"><h3>Existing content</h3>
      ${allLOs.map(lo=>{
        const c = content[lo.id] || {videos:[],files:[],quizzes:[]};
        const total = (c.videos?.length||0)+(c.files?.length||0)+(c.quizzes?.length||0);
        if(!total) return '';
        const icons = {videos:'fa-video',files:'fa-file',quizzes:'fa-question-circle'};
        return `<div style="margin-bottom:18px;"><h4 style="font-size:0.95rem;margin-bottom:6px;">${esc(lo.title)}</h4>
          ${['videos','files','quizzes'].map(kind=>{
            const items = c[kind]||[];
            if(!items.length) return '';
            return items.map((item,i)=>`<div class="admin-list-row" style="padding:8px 0;"><div class="info" style="display:flex;align-items:center;gap:8px;"><i class="fas ${icons[kind]}" style="color:var(--amber);font-size:0.85rem;"></i><span style="font-size:0.88rem;">${esc(item.title)}</span></div><div class="admin-list-actions"><button class="btn btn-danger btn-sm" data-del="${i}" data-type="learningContent" data-lo="${lo.id}" data-kind="${kind}">Delete</button></div></div>`).join('');
          }).join('')}
        </div>`;
      }).join('') || '<p class="help-note">No content uploaded yet.</p>'}
    </div>`;
}

function renderJourneyTab(){
  const items = load(KEYS.journey, []);
  return `
    <div class="card"><h3>Add Learning Journey item</h3>
      <form id="formAdd" class="form-grid">
        <input name="unit" placeholder="Unit / category" required>
        <input name="title" placeholder="Title" required>
        <input name="grade" placeholder="Grade range" class="full-row">
        <textarea name="desc" placeholder="Description" class="full-row"></textarea>
        <button type="submit" class="btn btn-primary full-row" style="justify-content:center;">Add</button>
      </form>
    </div>
    <div class="card"><h3>Journey items (${items.length})</h3>
      ${items.map((it,i)=>`<div class="admin-list-row"><div class="info"><h4>${esc(it.title)}</h4><p>${esc(it.unit||'')}</p></div><div class="admin-list-actions"><button class="btn btn-danger btn-sm" data-del="${i}" data-type="journey">Delete</button></div></div>`).join('') || '<p class="help-note">No journey items yet.</p>'}
    </div>`;
}

function renderResearchTab(){
  const topics = load(KEYS.researchTopics, DEFAULT_TOPICS);
  return `
    <div class="card"><h3>Add research topic</h3>
      <form id="formAdd" class="form-grid">
        <input name="icon" placeholder="Icon (emoji)" value="📄">
        <input name="title" placeholder="Topic title" required>
        <textarea name="desc" placeholder="Description" class="full-row"></textarea>
        <button type="submit" class="btn btn-primary full-row" style="justify-content:center;">Add topic</button>
      </form>
    </div>
    <div class="card"><h3>Topics (${topics.length})</h3>
      ${topics.map(t=>`<div class="admin-list-row"><div class="info"><h4>${esc(t.icon||'')} ${esc(t.title)}</h4><p>${esc(t.desc||'')}</p></div><div class="admin-list-actions"><button class="btn btn-danger btn-sm" data-del="${t.key}" data-type="researchTopics">Delete</button></div></div>`).join('')}
    </div>`;
}

function renderResearchContentTab(){
  const topics = load(KEYS.researchTopics, DEFAULT_TOPICS);
  const content = load(KEYS.researchContent, {});
  return `
    <div class="card"><h3>Upload to research topic</h3>
      <form id="formAdd" class="form-grid">
        <select name="topicKey" required class="full-row"><option value="">-- Choose topic --</option>${topics.map(t=>`<option value="${t.key}">${t.icon||''} ${esc(t.title)}</option>`).join('')}</select>
        <select name="kind" required><option value="sessions">🎥 Session</option><option value="files">📄 File</option><option value="tasks">✅ Task</option></select>
        <input name="title" placeholder="Title" required>
        <input name="url" placeholder="URL (optional)" class="full-row">
        <button type="submit" class="btn btn-primary full-row" style="justify-content:center;">Add</button>
      </form>
    </div>
    <div class="card"><h3>Existing content</h3>
      ${topics.map(t=>{
        const c = content[t.key] || {sessions:[],files:[],tasks:[]};
        const total = (c.sessions?.length||0)+(c.files?.length||0)+(c.tasks?.length||0);
        if(!total) return '';
        const icons = {sessions:'fa-play',files:'fa-file',tasks:'fa-check-square'};
        return `<div style="margin-bottom:18px;"><h4 style="font-size:0.95rem;margin-bottom:6px;">${t.icon||''} ${esc(t.title)}</h4>
          ${['sessions','files','tasks'].map(kind=>{
            const items = c[kind]||[];
            if(!items.length) return '';
            return items.map((item,i)=>`<div class="admin-list-row" style="padding:8px 0;"><div class="info" style="display:flex;align-items:center;gap:8px;"><i class="fas ${icons[kind]}" style="color:var(--amber);font-size:0.85rem;"></i><span style="font-size:0.88rem;">${esc(item.title)}</span></div><div class="admin-list-actions"><button class="btn btn-danger btn-sm" data-del="${i}" data-type="researchContent" data-topic="${t.key}" data-kind="${kind}">Delete</button></div></div>`).join('');
          }).join('')}
        </div>`;
      }).join('') || '<p class="help-note">No content uploaded yet.</p>'}
    </div>`;
}

function renderCompetitionsTab(){
  const comps = load(KEYS.competitions, []);
  return `
    <div class="card"><h3>Add competition</h3>
      <form id="formAdd" class="form-grid">

/* BIND */
function bindPanelEvents(){
  const form = document.querySelector('#panel form');
  if(form) form.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());

    if(adminTab==='curriculum'){
      const curr = load(KEYS.curriculum, DEFAULT_CURRICULUM);
      if(!curr[data.group]) curr[data.group] = {items:[]};
      curr[data.group].items.push({id:genId('lo'), title:data.title});
      save(KEYS.curriculum, curr);
    }
    else if(adminTab==='learning'){
      const c = load(KEYS.learningContent, {});
      if(!c[data.loId]) c[data.loId] = {videos:[],files:[],quizzes:[]};
      if(!c[data.loId][data.kind]) c[data.loId][data.kind] = [];
      c[data.loId][data.kind].push({title:data.title, url:data.url||'#'});
      save(KEYS.learningContent, c);
    }
    else if(adminTab==='journey'){
      const items = load(KEYS.journey, []);
      items.push({unit:data.unit, title:data.title, grade:data.grade||'', desc:data.desc||''});
      save(KEYS.journey, items);
    }
    else if(adminTab==='research'){
      const topics = load(KEYS.researchTopics, DEFAULT_TOPICS);
      const key = (data.title||'').toLowerCase().replace(/[^a-z0-9]+/g,'-') || genId('topic');
      topics.push({key, icon:data.icon||'📄', title:data.title, desc:data.desc||''});
      save(KEYS.researchTopics, topics);
    }
    else if(adminTab==='researchContent'){
      const c = load(KEYS.researchContent, {});
      if(!c[data.topicKey]) c[data.topicKey] = {sessions:[],files:[],tasks:[]};
      if(!c[data.topicKey][data.kind]) c[data.topicKey][data.kind] = [];
      c[data.topicKey][data.kind].push({title:data.title, url:data.url||'#'});
      save(KEYS.researchContent, c);
    }
    else if(adminTab==='competitions'){
      const comps = load(KEYS.competitions, []);
      comps.push({id:genId('c'), ...data});
      save(KEYS.competitions, comps);
    }
    else if(adminTab==='programs'){
      const progs = load(KEYS.programs, DEFAULT_PROGRAMS);
      progs.push({id:genId('p'), ...data});
      save(KEYS.programs, progs);
    }
    else if(adminTab==='magazine'){
      const mags = load(KEYS.magazine, []);
      mags.push({id:genId('m'), ...data});
      save(KEYS.magazine, mags);
    }
    else if(adminTab==='books'){
      const books = load(KEYS.books, []);
      books.push({id:genId('b'), ...data});
      save(KEYS.books, books);
    }
    else if(adminTab==='users'){
      const users = load(KEYS.users, DEFAULT_USERS);
      users.push({...data, role:'admin'});
      save(KEYS.users, users);
    }
    else if(adminTab==='settings'){
      save(KEYS.settings, data);
    }
    paintPanel();
  });

  document.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=>{
    if(!confirm('Delete this item?')) return;
    const id = btn.dataset.del;
    const type = btn.dataset.type;
    if(type==='curriculum'){
      const curr = load(KEYS.curriculum, DEFAULT_CURRICULUM);
      const g = btn.dataset.group;
      curr[g].items = (curr[g].items||[]).filter(x=>x.id!==id);
      save(KEYS.curriculum, curr);
    }
    else if(type==='learningContent'){
      const c = load(KEYS.learningContent, {});
      const lo = btn.dataset.lo, kind = btn.dataset.kind;
      if(c[lo] && c[lo][kind]) c[lo][kind].splice(Number(id),1);
      save(KEYS.learningContent, c);
    }
    else if(type==='journey'){
      const items = load(KEYS.journey, []);
      items.splice(Number(id),1);
      save(KEYS.journey, items);
    }
    else if(type==='researchTopics'){
      save(KEYS.researchTopics, load(KEYS.researchTopics, DEFAULT_TOPICS).filter(x=>x.key!==id));
    }
    else if(type==='researchContent'){
      const c = load(KEYS.researchContent, {});
      const topic = btn.dataset.topic, kind = btn.dataset.kind;
      if(c[topic] && c[topic][kind]) c[topic][kind].splice(Number(id),1);
      save(KEYS.researchContent, c);
    }
    else if(type==='competitions'){ save(KEYS.competitions, load(KEYS.competitions, []).filter(x=>x.id!==id)); }
    else if(type==='programs'){ save(KEYS.programs, load(KEYS.programs, DEFAULT_PROGRAMS).filter(x=>x.id!==id)); }
    else if(type==='magazine'){ save(KEYS.magazine, load(KEYS.magazine, []).filter(x=>x.id!==id)); }
    else if(type==='books'){ save(KEYS.books, load(KEYS.books, []).filter(x=>x.id!==id)); }
    else if(type==='users'){ save(KEYS.users, load(KEYS.users, DEFAULT_USERS).filter(x=>x.username!==id)); }
    paintPanel();
  }));
}

if(currentUser && currentUser.role==='admin'){ renderAdmin(); } else { renderLogin(); }
