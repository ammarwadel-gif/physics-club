<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Club — Competitions</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--paper:#F1F2EE;--surface:#FFFFFF;--ink:#1B2440;--ink-soft:#525A78;--ink-faint:#848CA6;--line:#DBDCD4;--line-strong:#C2C4B9;--amber:#C97A1F;--amber-soft:#F3E2C8;--teal:#1F6E64;--teal-soft:#DCEBE8;--radius-s:3px;--radius-m:6px;--serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;--maxw:1180px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;background-attachment:fixed;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;}
@media (max-width:640px){body{background-size:40px 40px;}}

header.site{position:sticky;top:0;z-index:100;background:rgba(241,242,238,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line-strong);}
.nav-row{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:700;font-size:1.2rem;flex:none;}
.brand img{width:38px;height:38px;border-radius:50%;background:#fff;object-fit:contain;border:1px solid var(--line-strong);}
.brand small{display:block;font-family:var(--sans);font-weight:500;font-size:0.6rem;color:var(--ink-faint);margin-top:1px;}
nav.primary{display:flex;align-items:center;gap:2px;flex-wrap:wrap;}
nav.primary a{padding:8px 11px;border-radius:var(--radius-s);font-size:0.88rem;font-weight:500;color:var(--ink-soft);transition:all .15s;white-space:nowrap;}
nav.primary a:hover{background:var(--surface);color:var(--ink);}
nav.primary a.active{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--amber);}
.nav-right{display:flex;align-items:center;gap:8px;flex:none;}
.user-chip{display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;color:var(--ink);padding:6px 10px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--radius-s);}
@media (max-width:1080px){nav.primary{display:none;}}

.detail-hero{padding:40px 0 28px;border-bottom:1px solid var(--line-strong);}
.detail-hero h1{font-size:2.1rem;margin-top:10px;}
.breadcrumbs{font-size:0.82rem;color:var(--ink-faint);}
.breadcrumbs a:hover{color:var(--ink);text-decoration:underline;}
.section-tight{padding:44px 0;}

.scope-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;background:var(--surface);padding:8px;border:1px solid var(--line-strong);border-radius:var(--radius-m);}
.scope-tab{padding:10px 20px;font-size:0.9rem;font-weight:600;color:var(--ink-soft);border-radius:var(--radius-s);cursor:pointer;transition:all .15s;border:none;background:transparent;font-family:inherit;display:flex;align-items:center;gap:8px;}
.scope-tab.active{background:var(--ink);color:var(--paper);}
.scope-tab:hover:not(.active){background:var(--paper);color:var(--ink);}
.scope-tab .count{font-family:var(--mono);font-size:0.72rem;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,0.08);}
.scope-tab.active .count{background:rgba(255,255,255,0.22);}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-m);margin-bottom:22px;}
.filter-bar select{font-family:var(--sans);font-size:0.85rem;padding:8px 10px;border-radius:var(--radius-s);border:1px solid var(--line-strong);background:var(--paper);color:var(--ink);}
.fcount{margin-left:auto;font-size:0.8rem;color:var(--ink-faint);align-self:center;}

.comp-card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-m);padding:22px;display:flex;flex-direction:column;gap:12px;transition:all .15s;}
.comp-card:hover{border-color:var(--ink);box-shadow:0 4px 0 var(--amber);}
.comp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.comp-card h3{font-size:1.1rem;}
.comp-card p.desc{color:var(--ink-soft);font-size:0.9rem;}
.meta-line{font-family:var(--mono);font-size:0.74rem;color:var(--ink-faint);display:flex;gap:14px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:0.68rem;padding:3px 10px;border-radius:20px;font-weight:500;white-space:nowrap;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill-open{background:var(--teal-soft);color:var(--teal);}
.pill-soon{background:var(--amber-soft);color:var(--amber);}
.pill-closed{background:#EAEAE4;color:#8A8D82;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:760px){.grid-2{grid-template-columns:1fr;}}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-faint);border:1px dashed var(--line-strong);border-radius:var(--radius-m);background:var(--surface);}

footer.site-footer{background:var(--ink);color:#C9CEE0;margin-top:50px;padding:30px 0;text-align:center;font-size:0.82rem;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap nav-row">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="Physics Club" onerror="this.style.display='none'"><span>Physics Club<small>Academic ecosystem</small></span></a>
    <nav class="primary">
      <a href="index.html">Home</a>
      <a href="learning.html">Learning Hub</a>
      <a href="research.html">Research</a>
      <a href="competitions.html" class="active">Competitions</a>
      <a href="programs.html">Programs</a>
      <a href="about.html">About</a>
      <a href="profile.html">Profile</a>
    </nav>
    <div class="nav-right"><a href="login.html" id="adminChip" class="user-chip" style="display:none;"><i class="fas fa-user-shield"></i> <span id="adminName">Admin</span></a></div>
  </div>
</header>

<section class="detail-hero"><div class="wrap">
  <div class="breadcrumbs"><a href="index.html">Home</a> / Competitions</div>
  <h1>Competitions database</h1>
  <p style="color:var(--ink-soft);max-width:620px;margin-top:14px;">Pick a scope to filter — International, National, or Local.</p>
</div></section>

<section class="section-tight">
  <div class="wrap">
    <div class="scope-tabs" id="scopeTabs"></div>
    <div class="filter-bar">
      <select id="fType"><option value="all">All types</option></select>
      <select id="fDifficulty"><option value="all">All difficulties</option><option>Core</option><option>Intermediate</option><option>Advanced</option></select>
      <select id="fStatus"><option value="all">Any status</option><option value="open">Open</option><option value="soon">Coming soon</option><option value="closed">Closed</option></select>
      <span class="fcount" id="fCount"></span>
    </div>
    <div id="compList" class="grid-2"></div>
  </div>
</section>

<footer class="site-footer">© <span id="year"></span> Physics Club.</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
try{const s=sessionStorage.getItem('pc_session');if(s){const u=JSON.parse(s);if(u&&u.role==='admin'){document.getElementById('adminChip').style.display='flex';document.getElementById('adminChip').href='admin.html';document.getElementById('adminName').textContent=u.name||u.username;}}}catch(e){}

const DEFAULT_COMPETITIONS = [
  {id:'c1', name:'International Physics Olympiad (IPhO)', scope:'International', type:'Olympiad', grade:'11–12', difficulty:'Advanced', status:'open', deadline:'2027-01-15', eligibility:'Open to students who qualify through their national olympiad selection.'},
  {id:'c2', name:'National Physics Olympiad', scope:'National', type:'Olympiad', grade:'9–12', difficulty:'Intermediate', status:'open', deadline:'2026-10-30', eligibility:'Open to all high school students.'},
  {id:'c3', name:'F = ma Style Mechanics Exam', scope:'National', type:'Exam', grade:'9–12', difficulty:'Intermediate', status:'soon', deadline:'2026-12-05', eligibility:'Open to students who completed introductory mechanics.'},
  {id:'c4', name:'Regional Physics Bowl', scope:'Local', type:'Team Bowl', grade:'9–12', difficulty:'Core', status:'open', deadline:'2026-10-10', eligibility:'Teams of up to five students from the same school.'},
  {id:'c5', name:'Local Science Fair', scope:'Local', type:'Fair', grade:'9–12', difficulty:'Core', status:'open', deadline:'2026-11-15', eligibility:'Open to all local students.'},
  {id:'c6', name:'Experimental Physics Cup', scope:'International', type:'Experimental', grade:'10–12', difficulty:'Advanced', status:'closed', deadline:'2026-05-01', eligibility:'Teams of two to three students.'},
];

function load(key, fb){
  try{ const raw = localStorage.getItem(key); if(raw) return JSON.parse(raw); }catch(e){}
  return fb;
}
const comps = load('pc_competitions', DEFAULT_COMPETITIONS);

function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }catch(e){ return d; } }
function statusPill(s){
  const map = {open:['pill-open','Open'], soon:['pill-soon','Coming soon'], closed:['pill-closed','Closed']};
  const [cls,label] = map[s] || map.closed;
  return `<span class="pill ${cls}">${label}</span>`;
}

let scope = 'all';
let fType = 'all', fDifficulty = 'all', fStatus = 'all';

/* Populate type dropdown */
const types = [...new Set(comps.map(c=>c.type).filter(Boolean))];
document.getElementById('fType').innerHTML = '<option value="all">All types</option>' + types.map(t=>`<option>${t}</option>`).join('');

function paintTabs(){
  const scopes = [
    {key:'all', label:'All scopes'},
    {key:'International', label:'International'},
    {key:'National', label:'National'},
    {key:'Local', label:'Local'},
  ];
  document.getElementById('scopeTabs').innerHTML = scopes.map(s=>{
    const count = s.key==='all' ? comps.length : comps.filter(c=>c.scope===s.key).length;
    return `<button class="scope-tab ${scope===s.key?'active':''}" data-scope="${s.key}">${s.label} <span class="count">${count}</span></button>`;
  }).join('');
  document.querySelectorAll('[data-scope]').forEach(btn=> btn.addEventListener('click', ()=>{
    scope = btn.dataset.scope; paintTabs(); paintList();
  }));
}

function paintList(){
  const list = comps.filter(c=>{
    if(scope!=='all' && c.scope!==scope) return false;
    if(fType!=='all' && c.type!==fType) return false;
    if(fDifficulty!=='all' && c.difficulty!==fDifficulty) return false;
    if(fStatus!=='all' && c.status!==fStatus) return false;
    return true;
  });
  document.getElementById('fCount').textContent = `${list.length} competition${list.length===1?'':'s'}`;
  document.getElementById('compList').innerHTML = list.length ? list.map(c=>`
    <div class="comp-card">
      <div class="comp-top"><h3>${c.name}</h3>${statusPill(c.status)}</div>
      <p class="desc">${c.eligibility||''}</p>
      <div class="meta-line"><span>${c.scope}</span><span>Grade ${c.grade||''}</span><span>${c.difficulty||''}</span></div>
      <div class="meta-line"><span>Deadline: ${fmtDate(c.deadline)}</span></div>
    </div>
  `).join('') : `<div class="empty-state" style="grid-column:1/-1;">No competitions match these filters.</div>`;
}

document.getElementById('fType').addEventListener('change', e=>{ fType = e.target.value; paintList(); });
document.getElementById('fDifficulty').addEventListener('change', e=>{ fDifficulty = e.target.value; paintList(); });
document.getElementById('fStatus').addEventListener('change', e=>{ fStatus = e.target.value; paintList(); });

paintTabs();
paintList();
</script>
</body>
</html>
